app:
  name: farrepmachine
  env: dev

http:
  port: 8080
  read_timeout: 10s
  write_timeout: 30s

postgres:
  host: localhost
  port: 5432
  user: admin
  password: ${PGPASSWORD}
  dbname: 'ДАЛЬРЕММАРШ'
  sslmode: disable

keycloak:
  enabled: false
  url: http://localhost:8080
  realm: farrepmachine
  client_id: farrepmachine-client
  client_secret: ${KEYCLOAK_CLIENT_SECRET}

minio:
  endpoint: localhost:9000
  access_key_id: minioadmin
  secret_access_key: minioadmin

log:
  level: debug
  filePath: /var/log/farrepmachine.log
  max_size_mb: 100
  max_backups: 5
  max_age_days: 30